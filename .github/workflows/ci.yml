name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Full test suite in a containerized environment
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build smoke test image
      run: |
        docker build --target test -f docker/Dockerfile -t regulator-smoke-test .
        
    - name: Run test suite
      run: |
        # Run the full suite in container (unit + integration + smoke)
        docker run --rm \
          -v $(pwd)/tests:/app/tests \
          regulator-smoke-test \
          python -m pytest tests/ -v --tb=short

  # Container health check
  container-health:
    name: Container Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Build production image
      run: |
        docker build --target production -f docker/Dockerfile -t regulator-prod .
        
    - name: Test container startup
      run: |
        docker run -d \
          --name regulator-test \
          -p 5000:5000 \
          regulator-prod

        # Poll the health endpoint; fail the job if it never comes up
        for i in $(seq 1 30); do
          if curl -fsS http://localhost:5000/api/healthz; then
            exit_code=0; break
          fi
          exit_code=1; sleep 2
        done
        docker logs regulator-test
        docker rm -f regulator-test
        exit $exit_code

  # Native test matrix (faster feedback than the Docker job)
  test-matrix:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,ml,dashboard]"

    - name: Run tests with coverage
      run: pytest --cov=src/regulator --cov-report=term-missing

    - name: Execute demo notebook
      if: matrix.python-version == '3.11'
      run: pytest --nbmake regulator_demo.ipynb

  # Browser tests of the dashboard front end
  browser-tests:
    name: Browser Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,e2e]"
        playwright install --with-deps chromium

    - name: Run browser tests
      run: pytest -m e2e tests/e2e

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check formatting
      run: ruff format --check .

    - name: Run Ruff linter
      run: ruff check .

    - name: Run MyPy type checker
      run: mypy src/

    - name: Run pre-commit hooks
      run: pre-commit run --all-files

  # Build and push Docker images (on main branch)
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [tests, test-matrix, browser-tests, container-health, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write
      
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}
          
    - name: Build and push production image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        target: production
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        
    - name: Build and push development image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./docker/Dockerfile
        target: development
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max